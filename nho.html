<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài kiểm tra thường xuyên</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        header{
            color: white;
            background-color: #6c5;
            text-align: center;
            line-height: 40px;
        }
        main{
            display:grid;
            grid-template-columns: repeat(3, 1fr);
            gap:10px;
            padding:10px
        }
        .card{
            border-radius: 10px;
            background-color: aliceblue;
            box-shadow: 0 8 12px #ccc;
            padding:10px;
        }
        .card h3{
            margin-bottom: 10px;
        }
        footer{
            text-align: center;
            background-color: black;
            color:white;
            line-height:22px;
        }
        

    </style>

</head>
<body>
    <header>
        <h2>BÀI KIỂM TRA THƯỜNG XUYÊN</h2>
    </header>
    <main>
        <div class="card">
            <h3>Phần 1</h3>
            <p>Đây là</p>
        </div>

        <div class="card">
            <h3>Phần 2</h3>
            <p>Nếu là vậy</p>
        </div>

        <div class="card">
            <h3>Phần 3</h3>
            <p>Thuận lợi</p>
        </div>
    </main>
    <footer>
        &copy; Học thiết kế web thật hay
    </footer>
</body>
</html>
