        {text:"Câu 20. Điền đáp án:",numeric:true},
        {text:"Câu 21. Điền đáp án:",numeric:true},
        {text:"Các tứ phân vị của chiều cao (m) của 50 học sinh: Q1=1,62; Q2=1,69; Q3=1,73. Có bao nhiêu bạn cao bằng hoặc trên 1,73 m?",options:["13","12","14","11"]}
      ]
    };

    let lessonId = 4, index = 0, score = 0, streak = 0, checked = false;
    const answered = new Set();
    const el = id => document.getElementById(id);
    const normalize = v => String(v).trim().replace(",", ".").replace(/\s/g,"");

    function setLessonMenu(open) {
      el("questionNav").hidden = !open;
      el("backdrop").hidden = !open;
      el("menuToggle").setAttribute("aria-expanded", open ? "true" : "false");
    }
    function renderNav() {
      const box = el("questionList");
      box.innerHTML = "";
      lessons[lessonId].forEach((q,i) => {
        const b = document.createElement("button");
        b.type="button"; b.className="question-link"+(i===index?" current":"")+(answered.has(i)?" done":"");
        b.textContent=i+1;
        b.onclick=()=>{ index=i; checked=false; setLessonMenu(false); render(); };
        box.appendChild(b);
      });
    }
    function switchLesson(id) {
      lessonId=id; index=0; score=0; streak=0; checked=false; answered.clear();
      document.querySelectorAll("[data-lesson]").forEach(b=>b.classList.toggle("active",b.dataset.lesson===String(id)));
      el("title").textContent="Bài "+id;
      el("navTitle").textContent="Câu hỏi · Bài "+id;
      el("quizCard").style.display="block"; el("summary").style.display="none";
      render();
    }
    function render() {
      const questions=lessons[lessonId], q=questions[index];
      el("questionNumber").textContent="Câu "+(index+1)+"/"+questions.length;
      el("questionKind").textContent=q.multi?"Chọn nhiều đáp án":q.numeric?"Điền đáp án":"Trắc nghiệm";
      el("prompt").textContent=q.text;
      el("count").textContent=(index+1)+"/"+questions.length;
      el("score").textContent=score; el("streak").textContent=streak;
      el("progressBar").style.width=((index/questions.length)*100)+"%";
      el("feedback").textContent=""; el("feedback").className="";
      el("checkButton").hidden=false; el("nextButton").hidden=true; checked=false;
      const area=el("answerArea"); area.innerHTML="";
      if(q.numeric) {
        const div=document.createElement("div"); div.className="numeric";
        const input=document.createElement("input"); input.type="text"; input.placeholder="Nhập đáp án";
        div.appendChild(input); area.appendChild(div);
      } else {
        const div=document.createElement("div"); div.className="options";
        q.options.forEach((text,i)=>{
          const label=document.createElement("label"); label.className="option";
          const input=document.createElement("input"); input.type=q.multi?"checkbox":"radio"; input.name="answer"; input.value=i;
          const span=document.createElement("span"); span.textContent=text;
          label.appendChild(input); label.appendChild(span); div.appendChild(label);
        });
        area.appendChild(div);
      }
      renderNav();
    }
    function getAnswer() {
      const q=lessons[lessonId][index];
      if(q.numeric) return el("answerArea").querySelector("input").value;
      return [...el("answerArea").querySelectorAll("input:checked")].map(i=>Number(i.value)).sort((a,b)=>a-b);
    }
    function isCorrect(q,answer) {
      if(q.numeric) return q.answer!==undefined && normalize(answer)===normalize(q.answer);
      if(!q.answer) return null;
      const a=Array.isArray(answer)?answer:[answer];
      return a.length===q.answer.length && a.every(v=>q.answer.includes(v));
    }
    function checkAnswer() {
      if(checked) return;
      const q=lessons[lessonId][index], answer=getAnswer();
      const correct=isCorrect(q,answer);
      if(correct===null) {
        el("feedback").textContent="Câu này dùng dữ liệu công thức/bảng trong tài liệu; kiểm tra đáp án sau."; el("feedback").className="";
        checked=true; answered.add(index); el("checkButton").hidden=true; el("nextButton").hidden=false; renderNav(); return;
      }
      checked=true; answered.add(index);
      if(correct){ score+=10; streak++; el("feedback").textContent="Chính xác!"; el("feedback").className="good"; }
      else { streak=0; el("feedback").textContent="Chưa đúng. Đáp án: "+(q.answer===undefined?"":(q.numeric?q.answer:q.answer.map(i=>q.options[i]).join("; "))); el("feedback").className="bad"; }
      el("score").textContent=score; el("streak").textContent=streak;
      el("checkButton").hidden=true; el("nextButton").hidden=false; renderNav();
    }
    function nextQuestion() {
      const questions=lessons[lessonId];
      if(index<questions.length-1){ index++; render(); }
      else {
        el("quizCard").style.display="none"; el("summary").style.display="block";
        el("summaryText").textContent="Bạn đạt "+score+" điểm ở Bài "+lessonId+".";
      }
    }
    document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>switchLesson(Number(b.dataset.lesson)));
    el("menuToggle").onclick=()=>setLessonMenu(el("questionNav").hidden);
    el("backdrop").onclick=()=>setLessonMenu(false);
    el("menuClose").onclick=()=>setLessonMenu(false);
    el("checkButton").onclick=checkAnswer;
    el("nextButton").onclick=nextQuestion;
    el("restartButton").onclick=()=>switchLesson(lessonId);
    render();
  </script>
</body>
</html>
