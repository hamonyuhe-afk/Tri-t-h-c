<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn xin việc</title>
    <style>
    form {
        width: 400px;
        margin: 0 auto;
        padding: 20px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;

    }
    h3{
        text-align: center;
    }
    p{
        text-align: center;
    }

    tetarea {
        width: 100%;
        height: 100px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        resize: none;
    }
    

    </style>


</head>
<body>
    <div class="form">
        <h2>Đơn xin việc</h2>
        <p>Nhập thông tin ứng tuyển. CV định dạng PDF</p>

    <form onsubmit="return kiemTra()">
        <div class="hang">
            <label>Họ tên</label>
            <input type="text" id="hoten" placeholder="Nguyễn Văn A" required>
        </div>
        <div class="hang">
            <label>Email</label>
            <input type="email" id="email" placeholder="@email@domain.com"required>
        </div>

        <div class="hang">
            <label>Điện thoại</label>
            <input type="text" id="dienthoai" placeholder="0xxxxxxxxx" required>
        </div>
        <div class="hang">
            <label>Giới tính</label>
            <select >
                <option>Nam</option>
                <option>Nữ</option>
            </select>       
        </div>
        <div class="hang">
            <label>Trình độ</label>
            <select >
                <option>Trung cấp</option>
                <option>Cao đẳng</option>
                <option>Đại học</option>
                <option>Thạc sĩ</option>
                <option>Tiến sĩ</option>
            </select>
        </div>
        <div class="hang">
            <label>Kinh nghiệm (năm)</label>
            <input type="number"  placeholder="0-40">
        </div>
        <div class="hang">
            <label>Kỹ năng</label>
            <textarea  placeholder="VD : JavaScript, HTML, CSS..." ></textarea>
        </div>
        
        <div class="cv">
            <label>CV (PDF 5MB) </label>
            <input type="file" id="cv" accept=".pdf" >

        </div>
        <div class="nut">
            <button type="submit">Gửi hồ sơ</button>
            <button type="reset">Làm lại</button> 
        </div>
    </form>
    </div>
    
    <script>
        function kiemTra() {
            var hoten = document.getElementById("hoten").value;
            var email = document.getElementById("email").value;
            var dienthoai = document.getElementById("dienthoai").value;
            var cv = document.getElementById("cv").files;


        console.log("Họ tên:" + hoten);
        console.log("Email:"+ email);
        console.log("Điện thoại:" +dienthoai);
        console.log("CV:" + cv);


        if (hoten.trim().length == 0) {
        alert("Vui lòng nhập họ tên.");
        return false;
            }

        if (email.trim().length == 0){
        alert("Vui lòng nhập email.");
        return false;
}

if (dienthoai.trim().length == 0) {
    alert("Vui lòng nhập số điện thoại.");
    return false;
}

if (cv.length == 0) {
    alert("Vui lòng tải lên CV.");
    return false;
}
}
</script>
</body>
</html>
