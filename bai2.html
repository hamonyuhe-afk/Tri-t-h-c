<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<head>
    <title>Đánh giá sản phẩm</title>
</head>
<body>
    <table border="1" cellspacing="0" cellpadding="8" width="800" align="center">
    <tr>
        <td colspan="2" align="center" style="background-color:#d8c9e8">
            <h1 style="color:cornflowerblue;">Đánh giá sản phẩm</h1>
        </td>
    </tr>
    <tr>
        <td colspan="2" align="center" height="190">
        <img src="giay1.jpg" width="350" height="250">

        </td>
    </tr>
    <tr>
        <td width="280">
            <b>Họ tên:</b>
        </td>
        <td>
            <input type="text" size="55">
        </td>
    </tr>
    <tr>
        <td>
            <b>Email:</b>
        </td>
        <td>
            <input type="email" size="55">
        </td>
    </tr>
        <td>
            <b>Chất lượng sản phẩm:</b>
        </td>
        <td>
            <input type="radio" name="sao"> 5 sao
            <input type="radio" name="sao"> 4 sao
            <input type="radio" name="sao"> 3 sao
            <input type="radio" name="sao"> 2 sao
            <input type="radio" name="sao"> 1 sao
        </td>
    </tr>
    <tr>
        <td>
            <b>Bạn đã sử dụng trong bao lâu?</b>
        </td>
        <td>
            <select>
                <option>Dưới 1 tuần</option>
                <option>1 - 4 tuần</option>
                <option>1 - 6 tháng</option>
                <option>Trên 6 tháng</option>
            </select>
        </td>
    </tr>
    <tr>
        <td height="120">
        <b>Ý kiến thêm:</b>
        </td>
        <td>
            <textarea rows="6" cols="55" placeholder="Nhập nhận xét..."></textarea>
        </td>
    </tr>
    <tr>
        <td>
            <b>Gửi ảnh bạn chụp:</b>
        </td>
        <td>
            <input type="file">
        </td>
    </tr>
    <tr>
        <td colspan="2" align="center" >
            <input type="submit" value="Gửi đánh giá"> 
        </td>
    </tr>
</table>
<br>

</body>
</html>
