<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Grid</title>

    <style>
        .form {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #ccc;
            padding-top: 95px;
            padding-bottom: 70px;
        }

        .box {
            height: 65px;
            border: 2px solid #5C65FF;
            text-align: center;
            line-height: 65px;
            color: white;
            font-weight: bold;
        }

        .box1 {
            background-color: #287DBF;
        }

        .box2,
        .box3 {
            background-color: green;
        }

        @media (max-width: 600px) {
            .form {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <section class="form">
        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
    </section>

</body>
</html>
