<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Nhập mật khẩu 6 kí tự</h3>
    <input type="text" id="myInput" placeholder="Nhập vào đây">
    <button onclick="kiemTra()">Kiểm tra</button>
    <p id="thongBao" style="color:red"></p>

    <script>
        function kiemTra(){
            let text=document.getElementById("myInput").value;
            let tb=document.getElementById("thongBao");
            if(text.length <6){
                tb.innerHTML="Phải nhập mật khẩu ít nhất 6 số";
            }else{
                tb.innerHTML="Hợp lệ";
            }
        }
    </script>
</body>
</html>
